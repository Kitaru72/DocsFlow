[project]
name = "docsflow"
version = "0.1.0"
description = "CLI-приложение для подготовки данных лабораторных отчетов и генерации DOCX-документов"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Kitaru72" },
]
keywords = [
    "python",
    "cli",
    "json",
    "docx",
    "reports",
]
dependencies = [
    "python-docx>=1.2.0",
]

[project.urls]
Repository = "https://github.com/Kitaru72/DocsFlow"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
